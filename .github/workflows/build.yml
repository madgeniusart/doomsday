name: Build Universal Browser Sync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            name: macos-arm64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            name: macos-intel
          - platform: "ubuntu-22.04"
            args: ""
            name: linux
          - platform: "windows-latest"
            args: ""
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
  run: npm install --legacy-peer-deps


      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Universal Browser Sync ${{ github.ref_name }}"
          releaseBody: "Automated build. See assets below to download for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-sync-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: ignore

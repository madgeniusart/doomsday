name: Rust Backend Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        # Tells GitHub to step into the src-tauri folder before running the check
        working-directory: ./src-tauri
        run: cargo check

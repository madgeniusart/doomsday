<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Browser Sync</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg2: #1e293b;
        --border: rgba(255,255,255,0.08);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --green: #22c55e;
        --amber: #f59e0b;
        --red: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 320px;
        min-height: 200px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg2);
      }
      .logo {
        width: 24px; height: 24px;
        background: var(--accent);
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 12px; font-weight: 700;
      }
      h1 { font-size: 13px; font-weight: 600; }
      h1 span { color: var(--muted); font-weight: 400; }
      main { padding: 12px 14px; }
      .section-title {
        font-size: 10px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted); margin-bottom: 8px; margin-top: 12px;
      }
      .section-title:first-child { margin-top: 0; }
      .stat-row {
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .stat-row:last-child { border-bottom: none; }
      .stat-label { color: var(--muted); }
      .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
      .badge {
        display: inline-flex; align-items: center;
        padding: 2px 8px; border-radius: 99px;
        font-size: 10px; font-weight: 600;
      }
      .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
      .badge-amber { background: rgba(245,158,11,.15); color: var(--amber); }
      .badge-red   { background: rgba(239,68,68,.15);  color: var(--red);   }
      .btn {
        display: flex; align-items: center; justify-content: center;
        width: 100%; padding: 8px;
        background: var(--accent); color: white;
        border: none; border-radius: 8px;
        font-size: 12px; font-weight: 600;
        cursor: pointer; margin-top: 12px;
        transition: background 0.15s;
      }
      .btn:hover { background: #2563eb; }
      .btn.secondary { background: var(--bg2); border: 1px solid var(--border); color: var(--text); }
      .btn.secondary:hover { background: #334155; }
      .notice { color: var(--muted); font-size: 11px; line-height: 1.5; padding: 9px; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
      .site-name { font-size: 12px; font-weight: 600; overflow-wrap: anywhere; margin: 6px 0 10px; }
      .fine-print, .empty { color: var(--muted); font-size: 10px; line-height: 1.5; text-align: center; margin-top: 8px; }
      .summary { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
      .cookie-info { flex: 1; min-width: 0; }
      .flags { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
      .error { color: var(--red); padding: 12px 0; line-height: 1.5; }
      .loading { text-align: center; padding: 24px; color: var(--muted); }
      #cookie-list {
        max-height: 140px; overflow-y: auto;
        border: 1px solid var(--border); border-radius: 6px;
      }
      .cookie-row {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
      }
      .cookie-row:last-child { border-bottom: none; }
      .cookie-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-family: monospace; }
      .cookie-domain { color: var(--muted); font-size: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">↔</div>
      <h1>Universal Browser Sync <span>Helper</span></h1>
    </header>
    <main id="main">
      <div class="loading">Loading tab info…</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
